name: CI

# Tauri 2 app (Rust + vanilla TS). Runs on windows-latest (Windows-only tool).
# Runs on EVERY push/PR update so a green check on an older commit never masks a
# break on the latest fix.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint-test:
    name: Backend test + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC toolchain)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  frontend:
    name: Frontend typecheck + test + build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Frontend tests (vitest)
        run: npm test

      - name: Frontend build (tsc + vite)
        run: npm run build

  bundle:
    name: Build release exe
    runs-on: windows-latest
    needs: [lint-test, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Tauri build (release + installer)
        run: npm run tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyShortcut-installer
          path: |
            src-tauri/target/release/PyShortcut.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
